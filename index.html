<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0b0c0f" />
    <title>Avleron</title>
    <meta
      name="description"
      content="Discover movies and series, track what you watch and plan watching together. Powered by TMDB."
    />
    <script>
      // Applies the saved theme before the first paint, so the page never flashes the wrong theme.
      // Must stay in sync with src/storage/preferencesStorage.ts (key and shape).
      ;(function () {
        var theme = 'system'
        try {
          var saved = JSON.parse(localStorage.getItem('movietime.preferences.v1') || '{}')
          if (saved.theme === 'light' || saved.theme === 'dark') theme = saved.theme
        } catch (e) {}
        if (theme === 'system') {
          theme = matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark'
        }
        document.documentElement.dataset.theme = theme
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
